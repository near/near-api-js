name: Release

on:
  push:
    branches:
      - master
      - pre-release/*

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # Required for Trusted Pulishing to NPM
    environment: NPM
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to NPM
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore(release): publish packages"
          title: "Publish packages"
          createGithubReleases: ${{ github.ref_name == 'master' }}
          branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # disables Husky so it's NOT triggered when publishing tags for a new release
          HUSKY: 0
